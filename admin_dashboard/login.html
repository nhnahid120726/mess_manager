<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mess Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-mark" aria-hidden="true">M</span>
            <span>MESS MANAGER</span>
        </div>
        <h2>Welcome back</h2>
        <p>Sign in to manage your mess dashboard</p>

        <form id="login-form" onsubmit="return false;">
            <div class="form-group">
                <label for="email-input" class="input-label">Admin Email</label>
                <input
                    type="email"
                    id="email-input"
                    class="input-field"
                    placeholder="e.g. nahid3052026@gmail.com"
                    value="nahid3052026@gmail.com"
                    required
                    autocomplete="username"
                />
            </div>

            <div class="form-group">
                <label for="password-input" class="input-label">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password-input"
                        class="input-field"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    />
                    <button type="button" id="toggle-password-btn" class="toggle-password-btn" title="Show/Hide Password">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-actions-row">
                <a href="#" id="forgot-password-btn" class="forgot-pwd-link">Forgot Password?</a>
            </div>

            <button type="submit" id="email-login-btn" class="btn btn-primary">
                <span id="btn-text">Log In</span>
            </button>
        </form>

        <div id="status-msg" class="status-msg"></div>
        <div id="login-error" class="error-msg"></div>
        <div id="login-success" class="success-msg" style="display: none;"></div>
    </div>

    <!-- Firebase Web SDK v10 (ES Modules) -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
